<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Grace</title>
<meta name="description" content="Agende seu horário no Studio Grace.">
<meta name="theme-color" content="#7B2D56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio Grace">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('sg_tema'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
    document.documentElement.dataset.tema = t;
  })();
</script>
<style>
:root {
  --fundo: #F6EFF2; --superficie: #FFFAFC; --tinta: #2B1A21; --suave: #6B5560; --linha: #E2D2D9;
  --acento: #7B2D56; --sobre-acento: #FFFFFF; --tinte: #EEDCE5;
  --ok: #24694B; --ok-fundo: #DDEFE5; --aviso: #8A5200; --aviso-fundo: #F8E8CD; --perigo: #A32C38; --perigo-fundo: #F8DFE1;
  --titulo: 'Italiana', 'Times New Roman', serif;
  --texto: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
[data-tema="escuro"] {
  --fundo: #190F14; --superficie: #241820; --tinta: #F7EDF1; --suave: #BFA9B3; --linha: #3F2D36;
  --acento: #E8AFC8; --sobre-acento: #2B1A21; --tinte: #3B2430;
  --ok: #86D3AC; --ok-fundo: #1E3A2C; --aviso: #EDBE71; --aviso-fundo: #3D2E14; --perigo: #F4979F; --perigo-fundo: #47212A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 400 16px/1.5 var(--texto); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acento); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
[hidden] { display: none !important; }

.pagina { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px; }
.pagina-larga { max-width: 980px; }

/* Barra superior */
.topo { display: flex; align-items: center; gap: 8px; padding: 12px 0; min-height: 60px; padding-top: max(12px, env(safe-area-inset-top)); }
.topo .marca { font-family: var(--titulo); font-size: 22px; background: none; border: 0; padding: 4px 0; color: var(--tinta); }
.topo .espaco { flex: 1; }
.versao { font-size: 12px; color: var(--suave); white-space: nowrap; }
.icone { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--linha); background: transparent; color: var(--tinta); flex: none; }
.icone svg { width: 18px; height: 18px; }

/* Abertura */
.abertura { padding: 8px 0 36px; }
.abertura svg { display: block; width: 100%; max-width: 440px; height: auto; color: var(--acento); margin-left: -6px; overflow: visible; }
.abertura .guia { stroke: var(--suave); stroke-width: .6; stroke-dasharray: 2 4; fill: none; opacity: .75; }
.abertura .ponto { fill: var(--fundo); stroke: var(--suave); stroke-width: .8; }
.abertura h1 { font: 400 clamp(58px, 18vw, 96px)/.95 var(--titulo); margin: -6px 0 14px; letter-spacing: -.01em; }
.abertura p { font-size: 18px; color: var(--suave); max-width: 32ch; margin-bottom: 24px; }
.fio { stroke-linecap: round; fill: none; stroke: currentColor; }
.desenha .fio { opacity: 0; animation: surgir .35s ease-out forwards; animation-delay: calc(var(--t) * 1.1s); }
.desenha .guia, .desenha .ponto { opacity: 0; animation: guia .7s ease-out 1.1s forwards; }
@keyframes surgir { to { opacity: 1; } }
@keyframes guia { to { opacity: .75; } }
@media (prefers-reduced-motion: reduce) {
  .desenha .fio, .desenha .guia, .desenha .ponto { animation: none; opacity: 1; }
  * { scroll-behavior: auto !important; transition: none !important; }
}

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--linha); background: transparent; color: var(--tinta); font-weight: 600; text-decoration: none; text-align: center; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-principal { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
.btn-grande { min-height: 54px; padding: 12px 28px; font-size: 17px; }
.btn-bloco { width: 100%; }
.btn-menor { min-height: 38px; padding: 6px 14px; font-size: 14px; }
.btn-perigo { color: var(--perigo); border-color: var(--perigo); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-link { background: none; border: 0; padding: 8px 0; color: var(--acento); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; }

/* Seções */
.secao { padding: 28px 0; border-top: 1px solid var(--linha); }
.secao h2 { font: 400 34px/1.1 var(--titulo); margin-bottom: 14px; }
.suave { color: var(--suave); }
.pequeno { font-size: 14px; }

/* Caixa de preços: fica fechada até a cliente tocar */
.caixa-precos { background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; }
.caixa-precos summary { display: grid; grid-template-columns: 1fr 22px; column-gap: 12px; align-items: center; padding: 16px 18px; min-height: 76px; cursor: pointer; list-style: none; border-radius: 14px; }
.caixa-precos summary::-webkit-details-marker { display: none; }
.caixa-titulo { font: 400 30px/1.1 var(--titulo); grid-column: 1; }
.caixa-dica { color: var(--suave); font-size: 14px; grid-column: 1; margin-top: 2px; }
.caixa-precos summary svg { grid-column: 2; grid-row: 1 / span 2; width: 22px; height: 22px; color: var(--acento); transition: transform .18s ease; }
.caixa-precos[open] summary svg { transform: rotate(90deg); }
.caixa-precos[open] .caixa-dica { display: none; }
.caixa-lista { border-top: 1px solid var(--linha); }
.caixa-precos .precos { padding: 0 18px; }
.grupo-prof { font-weight: 700; font-size: 14px; color: var(--acento); margin: 18px 0 0; }
.caixa-precos .grupo-prof { padding: 0 18px; }
.caixa-nota { padding: 4px 18px 18px; }

/* Lista de preços */
.precos { list-style: none; padding: 0; margin: 0; }
.precos button { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; width: 100%; padding: 16px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--linha); }
.precos li:last-child button { border-bottom: 0; }
.precos .nome { font-weight: 600; font-size: 17px; }
.precos .preco { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; white-space: nowrap; }
.precos .det { color: var(--suave); font-size: 14px; }

.mapa { width: 100%; height: 240px; border: 1px solid var(--linha); border-radius: 12px; margin: 14px 0; display: block; background: var(--tinte); }

.rodape { padding: 24px 0 calc(32px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; color: var(--suave); }
.rodape button { background: none; border: 0; padding: 6px 0; color: var(--suave); text-decoration: underline; text-underline-offset: 3px; }

/* Passos do agendamento */
.passos { display: flex; gap: 6px; list-style: none; margin: 0 0 22px; padding: 0; }
.passos li { flex: 1; height: 4px; border-radius: 4px; background: var(--linha); }
.passos li.feito { background: var(--acento); }
.titulo-passo { font: 400 clamp(32px, 9vw, 40px)/1.08 var(--titulo); margin-bottom: 8px; }
.resumo { color: var(--suave); margin-bottom: 20px; }
.voltar { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 0; color: var(--suave); font-weight: 600; margin-bottom: 6px; }

/* Calendário */
.cal { background: var(--superficie); border: 1px solid var(--linha); border-radius: 14px; padding: 12px; }
.cal-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-topo strong { font-weight: 600; }
.inicial::first-letter { text-transform: uppercase; }
.cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-sem { text-align: center; font-size: 12px; color: var(--suave); padding: 4px 0; }
.cal-dia { aspect-ratio: 1; min-height: 40px; max-height: 64px; width: 100%; border: 0; border-radius: 10px; background: transparent; color: var(--suave); opacity: .45; font-weight: 500; padding: 0; position: relative; }
.cal-dia.ativo { background: var(--tinte); color: var(--tinta); opacity: 1; font-weight: 600; }
.cal-dia.livre { color: var(--tinta); opacity: 1; }
.cal-dia.sel { background: var(--acento); color: var(--sobre-acento); opacity: 1; }
.cal-dia.tem::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
.cal-dia[disabled] { cursor: default; }

.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-top: 12px; }
.slot { min-height: 48px; border: 1px solid var(--linha); border-radius: 10px; background: var(--superficie); font-weight: 600; }
.slot.sel { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }

/* Formulários */
.campo { display: block; margin-bottom: 16px; }
.campo > span { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.campo small { display: block; color: var(--suave); margin-top: 4px; font-size: 13px; }
input, select, textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--linha); border-radius: 10px; background: var(--superficie); font-size: 16px; }
textarea { min-height: 96px; resize: vertical; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opcao { display: block; width: 100%; text-align: left; padding: 16px; margin-bottom: 10px; border: 1px solid var(--linha); border-radius: 12px; background: var(--superficie); }
.opcao strong { display: block; font-size: 17px; }
.opcao span { color: var(--suave); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 42px; min-width: 50px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linha); background: transparent; font-weight: 600; font-size: 14px; }
.chip.sel { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }

/* Selos */
.selo { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.selo-ok { background: var(--ok-fundo); color: var(--ok); }
.selo-aviso { background: var(--aviso-fundo); color: var(--aviso); }
.selo-perigo { background: var(--perigo-fundo); color: var(--perigo); }
.selo-neutro { background: var(--tinte); color: var(--tinta); }

/* Aviso de versão nova */
.faixa { background: var(--acento); color: var(--sobre-acento); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; font-weight: 500; }
.faixa button { background: var(--sobre-acento); color: var(--acento); border: 0; border-radius: 999px; padding: 6px 16px; min-height: 36px; font-weight: 700; }

/* Pix */
.qr { background: #fff; padding: 12px; border-radius: 12px; width: min(280px, 100%); margin: 0 auto 14px; border: 1px solid var(--linha); }
.qr svg { display: block; width: 100%; height: auto; }
.valor-pix { font-weight: 700; font-size: 32px; line-height: 1.15; font-variant-numeric: tabular-nums; text-align: center; margin-bottom: 4px; }

/* Janela */
dialog { border: 0; border-radius: 18px; padding: 22px; width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--superficie); color: var(--tinta); }
dialog::backdrop { background: rgba(25, 15, 20, .6); }
dialog h3 { font: 400 28px/1.15 var(--titulo); margin-bottom: 8px; }

.aviso-toast { position: fixed; left: 50%; bottom: calc(82px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--tinta); color: var(--fundo); padding: 12px 18px; border-radius: 12px; z-index: 50; width: max-content; max-width: calc(100vw - 32px); font-weight: 500; box-shadow: 0 6px 24px rgba(25,15,20,.3); }

/* Administração */
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--superficie); border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom); }
.abas button { flex: 1; min-height: 62px; background: none; border: 0; color: var(--suave); font-size: 12px; font-weight: 600; display: grid; place-items: center; align-content: center; gap: 3px; padding: 6px 2px; }
.abas button svg { width: 21px; height: 21px; }
.abas button.sel { color: var(--acento); }
.corpo-admin { padding-bottom: 96px; }
.corpo-admin h1 { font: 400 38px/1.1 var(--titulo); margin: 4px 0 16px; }
.corpo-admin h2 { font: 400 26px/1.15 var(--titulo); margin: 0 0 10px; }
.segmento { display: flex; border: 1px solid var(--linha); border-radius: 999px; padding: 3px; gap: 2px; background: var(--superficie); margin-bottom: 12px; }
.segmento button { flex: 1; min-height: 38px; border: 0; background: transparent; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--suave); }
.segmento button.sel { background: var(--acento); color: var(--sobre-acento); }
.navega { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.navega strong { font-weight: 600; text-align: center; }
.numeros { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha); margin-bottom: 18px; }
.numeros div { padding: 12px 8px 12px 0; }
.numeros div + div { padding-left: 12px; border-left: 1px solid var(--linha); }
.numeros b { display: block; font-weight: 700; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.25; font-variant-numeric: tabular-nums; }
.numeros span { font-size: 13px; color: var(--suave); }
.dia-titulo { display: block; font-weight: 700; margin: 18px 0 6px; }
.dia-titulo::first-letter { text-transform: uppercase; }
.linha { background: var(--superficie); border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 8px; }
.linha > button { width: 100%; display: grid; grid-template-columns: 58px 1fr; gap: 10px; text-align: left; background: none; border: 0; padding: 12px; color: var(--tinta); }
.linha .hora { font-weight: 700; font-size: 17px; }
.linha .tit { font-weight: 600; display: block; }
.linha .sub { color: var(--suave); font-size: 14px; display: block; }
.linha .selos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.linha.cancelado .tit, .linha.cancelado .hora { text-decoration: line-through; color: var(--suave); }
.linha .mais { padding: 0 12px 14px; border-top: 1px solid var(--linha); padding-top: 12px; }
.linha .mais h4 { margin: 12px 0 6px; font-size: 14px; }
.linha .mais h4:first-child { margin-top: 0; }
.vazio { padding: 28px 16px; text-align: center; color: var(--suave); border: 1px dashed var(--linha); border-radius: 12px; }
.pendencias { background: var(--aviso-fundo); color: var(--aviso); padding: 14px 16px; border-radius: 12px; margin-bottom: 18px; }
.pendencias strong { display: block; margin-bottom: 8px; }
.pendencias button { display: block; background: none; border: 0; padding: 5px 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.bloco { padding: 24px 0; border-top: 1px solid var(--linha); }
.bloco:first-of-type { border-top: 0; padding-top: 0; }
.periodo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lista-simples { list-style: none; padding: 0; margin: 0; }
.lista-simples li { padding: 10px 0; border-bottom: 1px solid var(--linha); }
.cliente-btn { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; }
.colunas-horario { display: grid; gap: 22px; }

@media (min-width: 760px) {
  .abas { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--linha); background: var(--fundo); margin-bottom: 18px; padding: 0; }
  .abas button { display: flex; min-height: 50px; gap: 8px; font-size: 15px; justify-content: center; }
  .abas button.sel { box-shadow: inset 0 -2px 0 var(--acento); }
  .corpo-admin { padding-bottom: 48px; }
  .aviso-toast { bottom: 24px; }
  .colunas-horario { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
}
</style>
</head>
<body>
<div id="faixa-versao"></div>
<div id="app"></div>
<dialog id="janela"></dialog>
<div id="toast" class="aviso-toast" role="status" aria-live="polite" hidden></div>
<noscript>Ative o JavaScript para agendar seu horário no Studio Grace.</noscript>

    const comp = (altura * (.7 + acaso() * .45)) * (1 - mistura * .1) + mistura * 13;
    const n = [Math.sin(tangente), -Math.cos(tangente)];
    const ax = x + n[0] * desloca, ay = y + n[1] * desloca;
    const ex = ax + Math.cos(ang) * comp, ey = ay + Math.sin(ang) * comp;
    const curva = comp * (.16 + acaso() * .1);
    const cx = (ax + ex) / 2 + Math.sin(ang) * -curva, cy = (ay + ey) / 2 + Math.cos(ang) * curva;
    const esp = (1.3 + acaso() * .7) * (1 - t * .4);
    fios += `<path class="fio" style="--t:${t.toFixed(3)}" stroke-width="${esp.toFixed(2)}" d="M${ax.toFixed(1)} ${ay.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"/>`;
  }
  return `<svg class="${animar ? 'desenha' : ''}" viewBox="0 0 400 178" role="img" aria-label="Sobrancelha desenhada fio a fio">
    <path class="guia" d="M86 176L34 56M86 176L250 10M86 176L392 66"/>
    <circle class="ponto" cx="34" cy="56" r="2.6"/><circle class="ponto" cx="250" cy="10" r="2.6"/><circle class="ponto" cx="392" cy="66" r="2.6"/>
    ${fios}
  </svg>`;
}

/* ---------- Comunicação com o banco ---------- */
class ErroApp extends Error {}
async function rpc(fn, args) {
  let resp;
  try {
    resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args || {})
    });
  } catch (e) {
    throw new ErroApp('Sem conexão com a internet. Confira a rede e tente de novo.');
  }
  const corpo = await resp.json().catch(() => null);
  if (resp.ok) return corpo;
  const msg = corpo && corpo.message || '';
  if (msg.includes('SESSAO_EXPIRADA')) { sairAdmin(true); throw new ErroApp('Sua sessão terminou. Entre de novo.'); }
  if (corpo && corpo.code === 'P0001') throw new ErroApp(msg);
  console.error(fn, resp.status, corpo);
  if (corpo && corpo.code === 'PGRST202') throw new ErroApp('O banco de dados do Studio Grace ainda não foi instalado.');
  throw new ErroApp('Não foi possível concluir agora. Tente de novo em instantes.');
}

/* ---------- Pix (padrão BR Code do Banco Central) ---------- */
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    c ^= s.charCodeAt(i) << 8;
    for (let b = 0; b < 8; b++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function pixCodigo({ chave, nome, cidade, valor, txid }) {
  const conta = tlv('00', 'br.gov.bcb.pix') + tlv('01', chave);
  let p = tlv('00', '01') + tlv('26', conta) + tlv('52', '0000') + tlv('53', '986');
  if (Number(valor) > 0) p += tlv('54', Number(valor).toFixed(2));
  p += tlv('58', 'BR') + tlv('59', semAcento(nome).slice(0, 25).toUpperCase() || 'STUDIO GRACE') + tlv('60', semAcento(cidade).slice(0, 15).toUpperCase() || 'BRASIL');
  p += tlv('62', tlv('05', (String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25)) || '***'));
  p += '6304';
  return p + crc16(p);
}
function qrSvg(texto) {
  const q = qrcode(0, 'M');
  q.addData(texto);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}
/* A chave é normalizada para o formato que os bancos aceitam. */
function normalizarChave(tipo, chave) {
  const c = String(chave || '').trim();
  const dig = c.replace(/\D/g, '');
  if (tipo === 'cpf') { if (dig.length !== 11) throw new ErroApp('O CPF precisa ter 11 números.'); return dig; }
  if (tipo === 'cnpj') { if (dig.length !== 14) throw new ErroApp('O CNPJ precisa ter 14 números.'); return dig; }
  if (tipo === 'telefone') {
    const n = dig.length >= 12 && dig.startsWith('55') ? dig.slice(2) : dig;
    if (n.length < 10 || n.length > 11) throw new ErroApp('Informe o celular da chave com DDD.');
    return '+55' + n;
  }
  if (tipo === 'email') { if (!/^\S+@\S+\.\S+$/.test(c)) throw new ErroApp('Confira o e-mail da chave Pix.'); return c.toLowerCase(); }
  if (tipo === 'aleatoria') {
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c)) throw new ErroApp('A chave aleatória tem o formato 8-4-4-4-12, com letras e números.');
    return c.toLowerCase();
  }
  throw new ErroApp('Escolha o tipo da chave Pix.');
}

let toastTimer;
const TOAST = $('#toast');
function aviso(msg, ms = 3800) {
  const t = TOAST, j = $('#janela');
  (j.open ? j : document.body).appendChild(t); /* a janela aberta cobre o resto da página */
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function abrirJanela(html) {
  const j = $('#janela');
  document.body.appendChild(TOAST);
  j.innerHTML = html;
  if (!j.open) j.showModal();
}
const fecharJanela = () => { const j = $('#janela'); if (j.open) j.close(); };
function confirmar(titulo, texto, rotulo, perigo = true) {
  return new Promise(res => {
    abrirJanela(`<h3>${esc(titulo)}</h3><p class="suave" style="margin-bottom:18px">${esc(texto)}</p>
      <div class="acoes"><button class="btn ${perigo ? 'btn-perigo' : 'btn-principal'}" id="conf-sim">${esc(rotulo)}</button><button class="btn" id="conf-nao">Voltar</button></div>`);
    $('#conf-sim').onclick = () => { fecharJanela(); res(true); };
    $('#conf-nao').onclick = () => { fecharJanela(); res(false); };
  });
}
async function copiar(texto, msg) {
  try { await navigator.clipboard.writeText(texto); }
  catch (e) {
    const t = document.createElement('textarea');
    t.value = texto; ($('#janela').open ? $('#janela') : document.body).appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e2) {}
    t.remove();
  }
  aviso(msg);
}

function calendario({ mes, ativo, marca, sel, acao, min, max, livre }) {
  const prim = dt(inicioMes(mes));
  const ult = dt(fimMes(mes));
  let dias = '';
  for (let i = 0; i < prim.getUTCDay(); i++) dias += '<span></span>';
  for (let n = 1; n <= ult.getUTCDate(); n++) {
    const d = iso(new Date(Date.UTC(prim.getUTCFullYear(), prim.getUTCMonth(), n)));
    const a = ativo(d), l = livre && livre(d);
    dias += `<button type="button" class="cal-dia ${a ? 'ativo' : ''} ${l ? 'livre' : ''} ${d === sel ? 'sel' : ''} ${marca && marca(d) ? 'tem' : ''}" ${a || l ? '' : 'disabled'} data-a="${acao}" data-d="${d}" aria-label="${esc(dataLonga(d))}${a ? '' : ', sem horários'}">${n}</button>`;
  }
  const podeVoltar = inicioMes(mes) > inicioMes(min), podeIr = inicioMes(mes) < inicioMes(max);
  return `<div class="cal">
    <div class="cal-topo">
      <button type="button" class="icone" data-a="${acao}-mes" data-n="-1" ${podeVoltar ? '' : 'disabled style="opacity:.3"'} aria-label="Mês anterior">${ICONES.esq}</button>
      <strong class="inicial" style="display:block">${MESES[prim.getUTCMonth()]} de ${prim.getUTCFullYear()}</strong>
      <button type="button" class="icone" data-a="${acao}-mes" data-n="1" ${podeIr ? '' : 'disabled style="opacity:.3"'} aria-label="Próximo mês">${ICONES.dir}</button>
    </div>
    <div class="cal-grade">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<span class="cal-sem">${x}</span>`).join('')}${dias}</div>
  </div>`;
}

function intervaloAgenda() {
  const { periodo, ref } = S.ad;
  if (periodo === 'semana') {
    const de = somaDias(ref, -dt(ref).getUTCDay());
    return { de, ate: somaDias(de, 6) };
  }
  if (periodo === 'mes') return { de: inicioMes(ref), ate: fimMes(ref) };
  const de = inicioMes(ref);
  return { de, ate: fimMes(somaMeses(de, 2)) };
}
function rotuloIntervalo() {
  const { de, ate } = intervaloAgenda();
  const a = dt(de), b = dt(ate);
  if (S.ad.periodo === 'semana') return `${a.getUTCDate()}/${a.getUTCMonth() + 1} a ${b.getUTCDate()}/${b.getUTCMonth() + 1}/${b.getUTCFullYear()}`;
  if (S.ad.periodo === 'mes') return `${MESES[a.getUTCMonth()]} de ${a.getUTCFullYear()}`;
  return `${MESES[a.getUTCMonth()]} a ${MESES[b.getUTCMonth()]} de ${b.getUTCFullYear()}`;
}
const proAdm = id => S.ad.painel.profissionais.find(p => p.id === id);
const variasAdm = () => S.ad.painel.profissionais.length > 1;
const prosAtivas = () => S.ad.painel.profissionais.filter(p => p.ativo);
function pendenciasAgenda() {
  const p = S.ad.painel, c = p.config;
  const itens = [];
  const nome = x => variasAdm() ? `${x.nome}: ` : '';
  for (const x of prosAtivas()) {
    if (!p.servicos.some(s => s.profissional_id === x.id)) itens.push(['servicos', `${nome(x)}cadastrar os serviços e preços`]);
    if (!p.com_horarios.includes(x.id)) itens.push(['horarios', `${nome(x)}abrir dias e horários`]);
    if (!x.pix_chave) itens.push(['ajustes', `${nome(x)}informar a chave Pix`]);
  }
  if (!c.endereco) itens.push(['ajustes', 'Informar o endereço']);
  if (!c.whatsapp) itens.push(['ajustes', 'Informar o WhatsApp do Studio']);
  if (!itens.length) return '';
  return `<div class="pendencias"><strong>Falta configurar:</strong>${itens.map(([k, r]) => `<button data-a="aba" data-k="${k}">${esc(r.charAt(0).toUpperCase() + r.slice(1))}</button>`).join('')}</div>`;
}
function seletorProfissional(acao, atual, comTodas) {
  const lista = S.ad.painel.profissionais.filter(p => p.ativo || p.id === atual);
  if (!variasAdm() || !lista.length) return '';
  return `<div class="chips" role="group" aria-label="Profissional" style="margin-bottom:14px">
    ${comTodas ? `<button type="button" class="chip ${atual === null ? 'sel' : ''}" data-a="${acao}" data-id="" aria-pressed="${atual === null}">Todas</button>` : ''}
    ${lista.map(p => `<button type="button" class="chip ${atual === p.id ? 'sel' : ''}" data-a="${acao}" data-id="${p.id}" aria-pressed="${atual === p.id}">${esc(p.nome)}</button>`).join('')}
  </div>`;
}
function abaAgenda() {
  const ad = S.ad;
  let lista = '<p class="suave">Carregando…</p>', numeros = '';
  if (ad.agenda) {
    const agenda = ad.filtroProf === null ? ad.agenda : ad.agenda.filter(a => a.profissional_id === ad.filtroProf);
    const ativos = agenda.filter(a => a.status !== 'cancelado');
    const previsto = ativos.filter(a => a.status !== 'faltou').reduce((s, a) => s + Number(a.valor), 0);
    const recebido = agenda.filter(a => a.pagamento_status === 'pago').reduce((s, a) => s + Number(a.valor), 0);
    const conferir = agenda.filter(a => a.pagamento_status === 'informado' && a.status !== 'cancelado').length;
    numeros = `<div class="numeros"><div><b>${ativos.length}</b><span>agendamento${ativos.length === 1 ? '' : 's'}</span></div><div><b>${dinheiro(previsto)}</b><span>previsto</span></div><div><b>${dinheiro(recebido)}</b><span>recebido</span></div></div>
      ${conferir ? `<p class="selo selo-aviso" style="margin:-6px 0 14px;font-size:14px;padding:6px 12px;white-space:normal">${conferir} Pix informado${conferir > 1 ? 's' : ''} para conferir no banco</p>` : ''}`;
    if (!agenda.length) lista = '<div class="vazio">Nenhum agendamento neste período.</div>';
    else {
      let html = '', dia = '';
      for (const a of agenda) {
        if (a.data !== dia) { dia = a.data; html += `<h2 class="dia-titulo" style="font:700 16px/1.4 var(--texto)">${esc(dataLonga(dia))}</h2>`; }

  return `<h1>Agenda</h1>${pendenciasAgenda()}

    <div class="navega"><button class="icone" data-a="navega" data-n="-1" aria-label="Período anterior">${ICONES.esq}</button><strong class="inicial">${rotuloIntervalo()}</strong><button class="icone" data-a="navega" data-n="1" aria-label="Próximo período">${ICONES.dir}</button></div>

}

/* ---------- Carregamentos ---------- */
async function carregarPub() {
  try { S.pub = await rpc('sg_publico'); S.erroPub = null; }
  catch (e) { S.erroPub = e.message; }
}
async function carregarAgenda() {
  S.ad.agenda = null; render();
  const { de, ate } = intervaloAgenda();
  try { S.ad.agenda = await adRpc('sg_admin_agenda', { p_de: de, p_ate: ate }); } catch (e) { aviso(e.message); S.ad.agenda = []; }
  render();
}
async function carregarClientes() {
  S.ad.clientes = null; render();
  try { S.ad.clientes = await adRpc('sg_admin_clientes', { p_busca: S.ad.busca }); } catch (e) { aviso(e.message); S.ad.clientes = []; }
  render();
}
async function carregarDisp() {
  const p = S.ad.painel;
  try {
    S.ad.disp = await adRpc('sg_admin_disponibilidade', { p_profissional: S.ad.profHor, p_de: p.hoje, p_ate: p.limite });
  } catch (e) { aviso(e.message); }
  render();
}
async function carregarPainel() {
  S.ad.painel = await adRpc('sg_admin_painel');
  const p = S.ad.painel;
  S.ad.ref = S.ad.ref || p.hoje;
  S.ad.mesHor = S.ad.mesHor || p.hoje;
  if (!p.profissionais.some(x => x.id === S.ad.profHor)) S.ad.profHor = (p.profissionais.find(x => x.ativo) || p.profissionais[0]).id;
  if (S.ad.filtroProf !== null && !p.profissionais.some(x => x.id === S.ad.filtroProf)) S.ad.filtroProf = null;
  S.ad.form = S.ad.form || { de: somaDias(p.hoje, 1) > p.limite ? p.hoje : somaDias(p.hoje, 1), ate: p.limite, dias: ['1', '2', '3', '4', '5', '6'], ini1: '09:00', fim1: '12:00', ini2: '14:00', fim2: '18:00' };
}
async function iniciarAdmin() {
  S.tela = 'admin';
  if (!S.ad.token) { render(); return; }
  render();
  try {
    await carregarPainel();
    render();
    if (!S.ad.painel.trocar_senha) irAba(S.ad.aba);
  } catch (e) { aviso(e.message); render(); }
}
function irAba(k) {
  const ad = S.ad;
  ad.aba = k; ad.cliente = null; ad.editarServico = null; ad.editarProf = null; ad.aberto = null;
  scrollTo(0, 0);
  if (k === 'agenda') carregarAgenda();
  else if (k === 'clientes') carregarClientes();
  else if (k === 'horarios') { render(); carregarDisp(); }
  else render();
}
function lerFormHorarios() {
  const f = $('form[data-envio="abrir-dias"]');
  if (!f) return;
  const v = Object.fromEntries(new FormData(f));
  Object.assign(S.ad.form, v);
}
async function iniciarFluxo(servico) {
  const salvo = guarda.ler('sg_cliente', { nome: '', whatsapp: '' });
  S.fluxo = { passo: servico ? 2 : 1, servico: servico || null, dias: null, mes: S.pub.hoje, data: null, horas: null, hora: null, nome: salvo.nome, whatsapp: salvo.whatsapp, enviando: false, entrouNoPasso2: !!servico };
  S.tela = 'agendar';
  scrollTo(0, 0);
  render();
  if (servico) carregarDias();
}
async function carregarDias() {
  const f = S.fluxo;
  f.dias = null; f.data = null; f.horas = null; f.hora = null; render();
  try {
    f.dias = await rpc('sg_dias_disponiveis', { p_servico: f.servico });
    if (f.dias.length) f.mes = f.dias[0];
  } catch (e) { aviso(e.message); f.dias = []; }
  render();
}
async function carregarMeus() {
  S.tela = 'meus'; S.meus = null; scrollTo(0, 0); render();
  try { S.meus = await rpc('sg_meus', { p_codigos: codigosGuardados() }); }
  catch (e) { aviso(e.message); S.meus = []; }
  render();
}

/* ---------- Ações ---------- */
const acoes = {
  inicio() { S.tela = 'home'; if (location.hash) history.replaceState(null, '', location.pathname + location.search); scrollTo(0, 0); carregarPub().then(render); render(); },
  tema: alternarTema,
  atualizar: limparEAtualizar,
  'recarregar-pub'() { carregarPub().then(render); },
  'area-studio'() { location.hash = 'admin'; },
  agendar(d) { iniciarFluxo(d.id ? Number(d.id) : null); },
  meus() { carregarMeus(); },
  fechar: fecharJanela,
  'fluxo-voltar'() {
    const f = S.fluxo;
    if (f.passo === 1 || (f.passo === 2 && f.entrouNoPasso2)) { S.tela = 'home'; render(); return; }
    f.passo--; scrollTo(0, 0); render();
  },
  'fluxo-servico'(d) { S.fluxo.servico = Number(d.id); S.fluxo.passo = 2; scrollTo(0, 0); carregarDias(); },
  async 'fluxo-dia'(d) {
    const f = S.fluxo;
    f.data = d.d; f.horas = null; f.hora = null; render();
    try { f.horas = await rpc('sg_horarios', { p_servico: f.servico, p_data: d.d }); }
    catch (e) { aviso(e.message); f.horas = []; }
    render();
    const s = $('.slots'); if (s) s.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  'fluxo-dia-mes'(d) { const f = S.fluxo; f.mes = somaMeses(f.mes, Number(d.n)); render(); },
  'fluxo-hora'(d) { const f = S.fluxo; f.hora = d.h; f.passo = 3; scrollTo(0, 0); render(); },
  async 'fluxo-confirmar'(d) {
    const f = S.fluxo;
    if (f.enviando) return;
    f.enviando = true; render();
    try {
      const r = await rpc('sg_agendar', { p_servico: f.servico, p_data: f.data, p_hora: f.hora, p_nome: f.nome, p_whatsapp: f.whatsapp, p_pagamento: d.p });
      f.resultado = r;
      guarda.gravar('sg_codigos', [r.codigo, ...codigosGuardados()].slice(0, 30));
      guarda.gravar('sg_cliente', { nome: f.nome, whatsapp: f.whatsapp });
      S.tela = 'pronto'; scrollTo(0, 0); render();
      if (d.p === 'antecipado' && r.pix) janelaPix(r.pix, r.codigo, r.valor);
    } catch (e) {
      f.enviando = false;
      aviso(e.message, 6000);
      if (/ocupado/.test(e.message)) { f.passo = 2; f.hora = null; const data = f.data; await acoes['fluxo-dia']({ d: data }); } else render();
    }
  },
  pix(d) {
    const r = S.fluxo && S.fluxo.resultado;
    const item = r && r.codigo === d.codigo ? r : (S.meus || []).find(a => a.codigo === d.codigo);
    if (item && item.pix) janelaPix(item.pix, item.codigo, item.valor);
  },
  'pix-admin'(d) { janelaPix(pixDoProfissional(proAdm(Number(d.prof))), d.codigo, d.valor, true); },
  'pix-teste'() { janelaPix(pixDoProfissional(S.ad.editarProf), '', 0, true); },
  'copiar-pix'(d) { copiar(d.t, 'Código Pix copiado.'); },
  async 'pix-paguei'(d) {
    try {
      await rpc('sg_informar_pagamento', { p_codigo: d.codigo });
      abrirJanela(`<h3>Recebemos seu aviso</h3><p class="suave" style="margin-bottom:18px">O Studio vai conferir o Pix e confirmar o pagamento. Você acompanha em Meus horários.</p><button class="btn btn-principal btn-bloco" data-a="fechar-meus">Ver meus horários</button>`);
    } catch (e) { aviso(e.message); }
  },
  'fechar-meus'() { fecharJanela(); carregarMeus(); },

  aba(d) { irAba(d.k); },
  periodo(d) { S.ad.periodo = d.k; carregarAgenda(); },
  navega(d) {
    const n = Number(d.n), ad = S.ad;
    ad.ref = ad.periodo === 'semana' ? somaDias(ad.ref, 7 * n) : somaMeses(ad.ref, ad.periodo === 'mes' ? n : 3 * n);
    carregarAgenda();
  },
  'abrir-linha'(d) { const id = Number(d.id); S.ad.aberto = S.ad.aberto === id ? null : id; render(); },
  remarcar(d) {
    const a = S.ad.agenda.find(x => x.id === Number(d.id));
    const hoje = S.ad.painel.hoje;
    S.ad.remarcar = { a, data: a.data < hoje ? hoje : a.data };
    janelaRemarcar();
    carregarHorasRemarcar();
  },
  'rem-hora'(d, el) {
    $('#janela input[name=hora]').value = d.h;
    document.querySelectorAll('#rem-slots .slot').forEach(b => b.classList.toggle('sel', b === el));
  },
  async status(d) {
    const rotulos = { cancelado: ['Cancelar este horário?', 'O horário volta a ficar livre para outras clientes.', 'Cancelar horário'], faltou: ['Marcar como falta?', 'A falta fica registrada no histórico da cliente.', 'Marcar falta'] };
    if (rotulos[d.s] && !(await confirmar(...rotulos[d.s]))) return;
    try {
      await adRpc('sg_admin_atualizar_agendamento', { p_id: Number(d.id), p_status: d.s, p_pagamento_status: null, p_pagamento_forma: null });
      await recarregarAgendaSemPiscar();
    } catch (e) { aviso(e.message); }
  },
  async pagto(d) {
    try {
      await adRpc('sg_admin_atualizar_agendamento', { p_id: Number(d.id), p_status: null, p_pagamento_status: d.s, p_pagamento_forma: d.f || null });
      await recarregarAgendaSemPiscar();
      aviso(d.s === 'pago' ? 'Pagamento confirmado.' : 'Pagamento desfeito.');
    } catch (e) { aviso(e.message); }
  },
  async 'abrir-cliente'(d) {
    try {
      S.ad.aba = 'clientes';
      S.ad.cliente = await adRpc('sg_admin_cliente', { p_id: Number(d.id) });
      scrollTo(0, 0); render();
    } catch (e) { aviso(e.message); }
  },
  'voltar-clientes'() { S.ad.cliente = null; carregarClientes(); },
  async 'excluir-cliente'() {
    const c = S.ad.cliente;
    if (!(await confirmar(`Excluir ${c.nome}?`, 'O cadastro e todo o histórico desta cliente serão apagados. Esta ação não pode ser desfeita.', 'Excluir cliente'))) return;
    try { await adRpc('sg_admin_excluir_cliente', { p_id: c.id }); S.ad.cliente = null; aviso('Cliente excluída.'); carregarClientes(); }
    catch (e) { aviso(e.message); }
  },
  'servico-novo'() { const a = prosAtivas()[0] || S.ad.painel.profissionais[0]; S.ad.editarServico = { id: null, profissional_id: a.id, nome: '', descricao: '', preco: '', duracao_min: 30, ativo: true }; scrollTo(0, 0); render(); },
  'servico-editar'(d) { S.ad.editarServico = { ...S.ad.painel.servicos.find(s => s.id === Number(d.id)) }; scrollTo(0, 0); render(); },
  'servico-cancelar'() { S.ad.editarServico = null; render(); },
  async 'servico-excluir'() {
    const e = S.ad.editarServico;
    if (!(await confirmar(`Excluir ${e.nome}?`, 'O serviço deixa de aparecer para as clientes. Os agendamentos já feitos continuam na agenda.', 'Excluir serviço'))) return;
    try { await adRpc('sg_admin_excluir_servico', { p_id: e.id }); await carregarPainel(); S.ad.editarServico = null; aviso('Serviço excluído.'); render(); }
    catch (err) { aviso(err.message); }
  },
  'filtro-prof'(d) { S.ad.filtroProf = d.id ? Number(d.id) : null; S.ad.aberto = null; render(); },
  'hor-prof'(d) { lerFormHorarios(); S.ad.profHor = Number(d.id); S.ad.disp = null; S.ad.diaSel = null; render(); carregarDisp(); },
  'prof-novo'() { S.ad.editarProf = { id: null, nome: '', whatsapp: '', pix_tipo: '', pix_chave: '', pix_nome: '', pix_cidade: '', ativo: true }; scrollTo(0, 0); render(); },
  'prof-editar'(d) { S.ad.editarProf = { ...proAdm(Number(d.id)) }; scrollTo(0, 0); render(); },
  'prof-cancelar'() { S.ad.editarProf = null; render(); },
  async 'prof-excluir'() {
    const e = S.ad.editarProf;
    if (!(await confirmar(`Excluir ${e.nome}?`, 'A profissional sai do cadastro, com os dias e horários que estavam abertos.', 'Excluir profissional'))) return;
    try { await adRpc('sg_admin_excluir_profissional', { p_id: e.id }); await carregarPainel(); S.ad.editarProf = null; aviso('Profissional excluída.'); render(); }
    catch (err) { aviso(err.message, 7000); }
  },
  'hor-dia'(d) {
    lerFormHorarios();
    S.ad.diaSel = d.d; S.ad.form.de = d.d; S.ad.form.ate = d.d;
    S.ad.form.dias = ['0', '1', '2', '3', '4', '5', '6'];
    render();
  },
  'hor-dia-mes'(d) { lerFormHorarios(); S.ad.mesHor = somaMeses(S.ad.mesHor, Number(d.n)); render(); },
  'hor-chip'(d) {
    lerFormHorarios();
    const a = S.ad.form.dias, i = a.indexOf(d.i);
    if (i >= 0) a.splice(i, 1); else a.push(d.i);
    render();
  },
  async 'hor-fechar-dia'() {
    const dia = S.ad.diaSel;
    await fecharDias(dia, dia, ['0', '1', '2', '3', '4', '5', '6'], dataLonga(dia));
  },
  async 'hor-fechar-varios'() {
    lerFormHorarios();
    const f = S.ad.form;
    if (!f.de || !f.ate) { aviso('Informe as datas.'); return; }
    if (!f.dias.length) { aviso('Escolha ao menos um dia da semana.'); return; }
    await fecharDias(f.de, f.ate, f.dias, `${dataCurta(f.de)} a ${dataCurta(f.ate)}`);
  },
  async sair() {
    try { await adRpc('sg_admin_sair'); } catch (e) {}
    sairAdmin(false); S.tela = 'home'; render();
  }
};
async function fecharDias(de, ate, dias, rotulo) {
  if (!(await confirmar('Fechar estes dias?', `${rotulo}: as clientes não poderão mais marcar nesses dias. Os horários já marcados continuam na agenda.`, 'Fechar dias'))) return;
  try {
    const r = await adRpc('sg_admin_fechar_dias', { p_profissional: S.ad.profHor, p_de: de, p_ate: ate, p_dias: dias });
    await carregarPainel();
    await carregarDisp();
    aviso(`${r.dias} dia${r.dias === 1 ? '' : 's'} fechado${r.dias === 1 ? '' : 's'}.${r.marcados ? ` Atenção: há ${r.marcados} horário${r.marcados === 1 ? '' : 's'} marcado${r.marcados === 1 ? '' : 's'} nesse período.` : ''}`, 7000);
  } catch (e) { aviso(e.message); }
}
function janelaRemarcar() {
  const { a, data } = S.ad.remarcar;
  abrirJanela(`<h3>Alterar dia e hora</h3>
    <p class="suave" style="margin-bottom:16px">${esc(a.cliente)}, ${esc(a.servico)} (${duracaoTexto(a.duracao_min)}). Horário atual: ${esc(dataLonga(a.data))}, às ${esc(a.hora)}.</p>
    <form data-envio="remarcar">
      <label class="campo"><span>Novo dia</span><input type="date" name="data" required min="${S.ad.painel.hoje}" value="${data}"></label>
      <div id="rem-slots" class="campo"></div>
      <label class="campo"><span>Nova hora</span><input type="time" name="hora" required value="${esc(a.hora)}"><small>Escolha um horário livre acima ou digite outro, mesmo fora dos períodos abertos.</small></label>
      <div class="acoes"><button class="btn btn-principal">Salvar novo horário</button><button type="button" class="btn" data-a="fechar">Voltar</button></div>
    </form>`);
}
async function carregarHorasRemarcar() {
  const r = S.ad.remarcar, alvo = $('#rem-slots');
  if (!r || !alvo) return;
  const data = r.data;
  alvo.innerHTML = '<span class="suave pequeno">Buscando horários livres…</span>';
  try {
    const horas = await adRpc('sg_admin_horarios_remarcar', { p_id: r.a.id, p_data: data });
    if (S.ad.remarcar !== r || r.data !== data || !$('#rem-slots')) return;
    const atual = $('#janela input[name=hora]').value;
    $('#rem-slots').innerHTML = horas.length
      ? `<span>Horários livres</span><div class="slots" style="margin-top:0">${horas.map(h => `<button type="button" class="slot ${h === atual ? 'sel' : ''}" data-a="rem-hora" data-h="${h}">${h}</button>`).join('')}</div>`
      : '<span class="suave pequeno">Nenhum horário livre aberto neste dia. Você ainda pode digitar uma hora abaixo.</span>';
  } catch (e) {
    if ($('#rem-slots')) $('#rem-slots').innerHTML = '';
    aviso(e.message);
  }
}
async function recarregarAgendaSemPiscar() {
  const { de, ate } = intervaloAgenda();
  S.ad.agenda = await adRpc('sg_admin_agenda', { p_de: de, p_ate: ate });
  render();
}

const envios = {
  'fluxo-dados'(v) {
    const f = S.fluxo;
    f.nome = v.nome.trim(); f.whatsapp = v.whatsapp.trim();
    if (f.nome.length < 2) { aviso('Informe o seu nome.'); return; }
    const dig = f.whatsapp.replace(/\D/g, '');
    if (dig.length < 10 || dig.length > 13) { aviso('Informe o WhatsApp com DDD, por exemplo (85) 99999-9999.'); render(); return; }
    f.passo = 4; scrollTo(0, 0); render();
  },
  async entrar(v) {
    S.ad.erroEntrada = '';
    try {
      const r = await rpc('sg_admin_entrar', { p_senha: v.senha });
      if (!r.ok) { S.ad.erroEntrada = r.erro; render(); return; }
      S.ad.token = r.token; guarda.gravar('sg_admin_token', r.token);
      await iniciarAdmin();
    } catch (e) { S.ad.erroEntrada = e.message; render(); }
  },
  async 'trocar-senha'(v, form) {
    if (v.nova !== v.repetir) { aviso('As novas senhas não são iguais.'); return; }
    try {
      await adRpc('sg_admin_trocar_senha', { p_atual: v.atual, p_nova: v.nova });
      const era = S.ad.painel.trocar_senha;
      S.ad.painel.trocar_senha = false;
      aviso('Senha salva.');
      if (era) irAba('agenda'); else form.reset();
    } catch (e) { aviso(e.message); }
  },
  async 'salvar-studio'(v) { await salvarConfig({ frase: v.frase, endereco: v.endereco, mapa_link: v.mapa_link, whatsapp: v.whatsapp }, 'Dados do Studio salvos.'); },
  async 'salvar-prof'(v) {
    try {
      let chave = '';
      if (v.pix_chave.trim()) {
        chave = normalizarChave(v.pix_tipo, v.pix_chave);
        if (!v.pix_nome.trim() || !v.pix_cidade.trim()) throw new ErroApp('Informe o nome do recebedor e a cidade da chave Pix.');
      }
      await adRpc('sg_admin_salvar_profissional', { p_dados: { id: S.ad.editarProf.id, nome: v.nome, whatsapp: v.whatsapp, ativo: v.ativo === 'true', pix_tipo: v.pix_tipo, pix_chave: chave, pix_nome: v.pix_nome, pix_cidade: v.pix_cidade } });
      await carregarPainel();
      S.ad.editarProf = null;
      aviso('Profissional salva.');
      render();
    } catch (e) { aviso(e.message, 6000); }
  },
  async 'salvar-regras'(v) { await salvarConfig({ intervalo_min: Number(v.intervalo_min), antecedencia_min: Number(v.antecedencia_min) }, 'Regras salvas.'); },
  async 'salvar-servico'(v) {
    const preco = Number(String(v.preco).replace(/\./g, '').replace(',', '.'));
    if (!Number.isFinite(preco) || preco < 0) { aviso('Confira o preço.'); return; }
    try {
      await adRpc('sg_admin_salvar_servico', { p_dados: { id: S.ad.editarServico.id, profissional_id: Number(v.profissional_id), nome: v.nome, descricao: v.descricao, preco, duracao_min: Number(v.duracao_min), ativo: v.ativo === 'true' } });
      await carregarPainel();
      S.ad.editarServico = null;
      aviso('Serviço salvo.');
      render();
    } catch (e) { aviso(e.message); }
  },
  async 'abrir-dias'(v) {
    lerFormHorarios();
    const f = S.ad.form;
    if (!f.dias.length) { aviso('Escolha ao menos um dia da semana.'); return; }
    if (Boolean(v.ini2) !== Boolean(v.fim2)) { aviso('Preencha início e fim do segundo período, ou deixe os dois vazios.'); return; }
    const periodos = [{ inicio: v.ini1, fim: v.fim1 }];
    if (v.ini2) periodos.push({ inicio: v.ini2, fim: v.fim2 });
    try {
      const r = await adRpc('sg_admin_abrir_dias', { p_profissional: S.ad.profHor, p_de: v.de, p_ate: v.ate, p_dias: f.dias, p_periodos: periodos });
      await carregarPainel();
      await carregarDisp();
      aviso(r.dias ? `${r.dias} dia${r.dias === 1 ? '' : 's'} aberto${r.dias === 1 ? '' : 's'}.` : 'Nenhum dia aberto: o período não inclui os dias da semana escolhidos.');
    } catch (e) { aviso(e.message, 6000); }
  },
  async remarcar(v) {
    const { a } = S.ad.remarcar;
    try {
      const r = await adRpc('sg_admin_remarcar', { p_id: a.id, p_data: v.data, p_hora: v.hora });
      S.ad.ref = r.data;
      S.ad.aberto = a.id;
      await recarregarAgendaSemPiscar();
      const msg = `Olá, ${a.cliente.split(' ')[0]}! Seu horário de ${a.servico} no Studio Grace foi alterado para ${dataLonga(r.data)}, às ${r.hora}.`;
      abrirJanela(`<h3>Horário alterado</h3>
        <p style="margin-bottom:4px">${esc(a.cliente)}, ${esc(a.servico)}</p>
        <p class="suave" style="margin-bottom:18px">${esc(dataLonga(r.data))}, às ${esc(r.hora)}.</p>
        <div class="acoes" style="flex-direction:column">
          <a class="btn btn-principal" href="${esc(linkZap(a.whatsapp, msg))}" target="_blank" rel="noopener">${ICONES.zap} Avisar a cliente no WhatsApp</a>
          <button class="btn" data-a="fechar">Concluir</button>
        </div>`);
    } catch (e) { aviso(e.message, 6000); }
  },
  async 'buscar-clientes'(v) { S.ad.busca = v.busca.trim(); carregarClientes(); },
  async 'salvar-cliente'(v) {
    try {
      await adRpc('sg_admin_salvar_cliente', { p_id: S.ad.cliente.id, p_nome: v.nome, p_observacoes: v.observacoes });
      S.ad.cliente = await adRpc('sg_admin_cliente', { p_id: S.ad.cliente.id });
      aviso('Cadastro salvo.'); render();
    } catch (e) { aviso(e.message); }
  }
};
async function salvarConfig(dados, msg) {
  try {
    await adRpc('sg_admin_salvar_config', { p_dados: dados });
    await carregarPainel();
    aviso(msg); render();
  } catch (e) { aviso(e.message); }
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = acoes[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el);
});
document.addEventListener('submit', async e => {
  const f = e.target, fn = envios[f.dataset.envio];
  if (!fn) return;
  e.preventDefault();
  const b = f.querySelector('button:not([type=button])');
  if (b) b.disabled = true;
  try { await fn(Object.fromEntries(new FormData(f)), f); }
  finally { if (b && b.isConnected) b.disabled = false; }
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.mascara === 'zap') {
    let d = e.target.value.replace(/\D/g, '');
    if (d.startsWith('55') && d.length > 11) d = d.slice(2);
    d = d.slice(0, 11);
    let r = d;
    if (d.length > 2) r = `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length > 6) r = d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    e.target.value = r;
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'data' && e.target.closest('form[data-envio="remarcar"]') && e.target.value) {
    S.ad.remarcar.data = e.target.value;
    carregarHorasRemarcar();
  }
});
document.addEventListener('toggle', e => {
  if (e.target.classList && e.target.classList.contains('caixa-precos')) S.precosAberto = e.target.open;
}, true);
window.addEventListener('hashchange', roteador);

/* ---------- Desenho e início ---------- */
function render() {
  const app = $('#app');
  const telas = { home: telaHome, agendar: telaAgendar, pronto: telaPronto, meus: telaMeus, admin: telaAdmin };
  const foco = document.activeElement && document.activeElement.name;
  const inputValor = foco && document.activeElement.value;
  app.innerHTML = telas[S.tela]();
  if (foco && S.tela === 'admin') {
    const el = app.querySelector(`[name="${foco}"]`);
    if (el) { el.value = inputValor; el.focus(); }
  }
}
function roteador() {
  if (location.hash === '#admin') iniciarAdmin();
  else if (S.tela === 'admin') { S.tela = 'home'; render(); }
}
(async function iniciar() {
  roteador();
  if (S.tela !== 'admin') render();
  await carregarPub();
  if (S.tela === 'home') render();
  buscarVersaoNova();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
